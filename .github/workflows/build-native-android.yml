# Builds the pure-native (no Qt) Android demo of RavAva.
#
# Place the demo folder as:
#   crazyfull/RavAva/android4-demo/
#
# IMPORTANT: Copy this workflow to the REPO ROOT:
#   .github/workflows/build-native-android.yml
#
# Trigger: Actions → "Build Native Android Demo" → Run workflow

name: Build Native Android Demo

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build (or 'all')"
        type: choice
        options: [all, arm64-v8a, armeabi-v7a]
        default: all

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect demo folder
        id: demo
        run: |
          if [ -d build-demo/android-native ]; then
            echo "dir=build-demo/android-native" >> $GITHUB_OUTPUT
          else
            echo "build-demo/android-native not found."
            echo "Contents of build-demo:"
            ls -la build-demo
            exit 1
          fi
          echo "Using demo folder: $(grep dir= $GITHUB_OUTPUT)"
          echo "Contents of demo folder:"
          ls -la "$(grep dir= $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Verify RavAva sources
        run: |
          test -f src/ravava/Recorder.h || { echo "src/ravava/Recorder.h missing"; exit 1; }
          test -f miniaudio/miniaudio.c  || { echo "miniaudio/miniaudio.c missing"; exit 1; }
          test -f "${{ steps.demo.outputs.dir }}/app/src/main/cpp/CMakeLists.txt" || {
            echo "Demo CMakeLists.txt missing"
            exit 1
          }
          echo "Sources OK"

      - name: Skip unwanted ABI
        id: skip
        run: |
          REQUESTED="${{ github.event.inputs.abi }}"
          CURRENT="${{ matrix.abi }}"
          if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ] || [ "$REQUESTED" = "$CURRENT" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Skipping $CURRENT (requested: $REQUESTED)"
          fi

      - name: Set up JDK 17
        if: steps.skip.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK path
        if: steps.skip.outputs.run == 'true'
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install NDK, CMake, platform & build-tools
        if: steps.skip.outputs.run == 'true'
        run: |
          SDK=/usr/local/lib/android/sdk
          SM=$(find $SDK/cmdline-tools -name sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found, downloading cmdline-tools..."
            curl -sL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p $SDK/cmdline-tools/latest
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools/* $SDK/cmdline-tools/latest/
            SM=$SDK/cmdline-tools/latest/bin/sdkmanager
          fi
          echo "Using sdkmanager: $SM"
          yes | $SM --licenses >/dev/null 2>&1 || true
          $SM --install \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK=$SDK/ndk/26.1.10909125" >> $GITHUB_ENV

      # ---------------------------------------------------------------- webrtc-audio-processing (static, optional: echo / noise / AGC / high-pass)
      - name: Cache webrtc-audio-processing
        if: steps.skip.outputs.run == 'true'
        id: webrtc_cache
        uses: actions/cache@v4
        with:
          path: webrtc-install
          key: webrtc-1.3-native-android-${{ matrix.abi }}-api21-ndk26.1.10909125-${{ hashFiles('libs/webrtc/build_android.sh') }}

      - name: Build webrtc-audio-processing (static, ${{ matrix.abi }})
        if: steps.skip.outputs.run == 'true' && steps.webrtc_cache.outputs.cache-hit != 'true'
        continue-on-error: true            # no echo cancellation is better than no APK
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ANDROID_API: "21"
        run: |
          pip install meson ninja
          WFILE="webrtc-audio-processing-1.3.tar.xz"
          mkdir -p webrtc-src
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 \
                -o webrtc.tar.xz "https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/${WFILE}"; then
            echo "Primary server failed. Trying GitLab..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 \
                -o webrtc.tar.xz "https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v1.3/webrtc-audio-processing-v1.3.tar.gz"
          fi
          tar xf webrtc.tar.xz -C webrtc-src --strip-components=1
          libs/webrtc/build_android.sh webrtc-src ${{ matrix.abi }} webrtc-install

      - name: Is webrtc available?
        if: steps.skip.outputs.run == 'true'
        id: webrtc
        run: |
          if [ -f webrtc-install/lib/libwebrtc_apm.a ]; then
            echo "root=$GITHUB_WORKSPACE/webrtc-install" >> "$GITHUB_OUTPUT"
            echo "status=ON" >> "$GITHUB_OUTPUT"
          else
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "status=OFF" >> "$GITHUB_OUTPUT"
            echo "::warning::webrtc-audio-processing was not built for ${{ matrix.abi }}: the APK has no echo cancellation"
          fi

      - name: Ensure Gradle Wrapper exists
        if: steps.skip.outputs.run == 'true'
        working-directory: ${{ steps.demo.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            echo "gradlew already present"
            chmod +x gradlew
          else
            echo "gradlew missing – creating wrapper..."
            mkdir -p gradle/wrapper
            # Download wrapper jar
            for url in https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar \
                       https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar; do
              curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 120 \
                -o gradle/wrapper/gradle-wrapper.jar "$url" && unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1 && break
              echo "wrapper jar download from $url failed, trying the next"
              rm -f gradle/wrapper/gradle-wrapper.jar
            done
            test -f gradle/wrapper/gradle-wrapper.jar
            cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
            # Minimal gradlew script
            cat > gradlew << 'SCRIPT'
          #!/bin/sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
            chmod +x gradlew
            echo "Wrapper created"
          fi
          ls -la gradlew gradle/wrapper/

      - name: Build debug APK (${{ matrix.abi }})
        if: steps.skip.outputs.run == 'true'
        working-directory: ${{ steps.demo.outputs.dir }}
        run: |
          ./gradlew assembleDebug \
            -PravavaAbi=${{ matrix.abi }} \
            ${{ steps.webrtc.outputs.root != '' && format('-PwebrtcRoot={0}', steps.webrtc.outputs.root) || '' }} \
            --stacktrace 2>&1 | tee build.log

          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "===== No APK produced. Looking for CMake/native errors ====="
            # Prefer the real CMake error if present
            grep -n -E "error:|CMake Error|FAILED:|fatal error" build.log | tail -40 || true
            echo "===== Last 150 lines of build.log ====="
            tail -150 build.log
            # Also dump cxx logs if they exist
            find app/.cxx -name "*.log" 2>/dev/null | head -5 | while read f; do
              echo "===== $f ====="
              tail -80 "$f" || true
            done
            exit 1
          fi
          echo "APK=$APK" >> $GITHUB_ENV
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Basic APK checks
        if: steps.skip.outputs.run == 'true'
        working-directory: ${{ steps.demo.outputs.dir }}      # (APK is a path relative to the demo folder)
        run: |
          APK="${{ env.APK }}"
          AAPT2=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort -V | tail -1)
          echo "Using $AAPT2"
          "$AAPT2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.ravava.demo'" badging.txt
          (grep -q "sdkVersion:'21'" badging.txt || grep -q "minSdkVersion:'21'" badging.txt)
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          echo "APK OK"

      - name: Upload APK
        if: steps.skip.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RavAva-NativeDemo-${{ matrix.abi }}
          path: ${{ steps.demo.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summary
        if: steps.skip.outputs.run == 'true'
        run: |
          echo "### Native Demo – ${{ matrix.abi }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: \`RavAva-NativeDemo-${{ matrix.abi }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- minSdk 21 · WebRTC OFF · Loopback + UDP" >> $GITHUB_STEP_SUMMARY
