# Builds the RavAva iPhone demo (ios-demo/) as an UNSIGNED .ipa on a macOS runner (no Mac needed by the developer).
# The library itself (RavAva + Opus + webrtc in one libRavAva.a, plus headers) comes from build-static-library-ios.yml;
# this workflow only compiles the app against that artifact.
# The .ipa is signed later on the PC with Sideloadly / AltStore using a free Apple ID (see ios-demo/README.md).
name: Build Demo iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-demo/**'
      - 'android5-native-demo/app/src/main/cpp/VoiceSession.*'
      - 'libs/webrtc/build_ios.sh'
      - 'src/ravava/**'
      - '.github/workflows/build-demo-ios.yml'
      - '.github/workflows/build-static-library-ios.yml'

jobs:
  library:
    uses: ./.github/workflows/build-static-library-ios.yml

  ios-demo:
    needs: library
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the iOS library
        uses: actions/download-artifact@v4
        with:
          name: RavAva-iOS-static
          path: RavAva-iOS

      - name: Check the library
        run: |
          lipo -info RavAva-iOS/lib/libRavAva.a
          ls RavAva-iOS/include | head -20

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios-demo && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -euxo pipefail
          cd ios-demo
          xcodebuild -project RavAvaDemo.xcodeproj -scheme RavAvaDemo -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 60
          test -d build/Build/Products/Release-iphoneos/RavAva.app

      - name: Pack the .ipa
        run: |
          set -euxo pipefail
          mkdir -p Payload
          cp -R ios-demo/build/Build/Products/Release-iphoneos/RavAva.app Payload/
          plutil -p Payload/RavAva.app/Info.plist | head -20
          lipo -info Payload/RavAva.app/RavAva
          zip -qr RavAva-iOS-unsigned.ipa Payload
          ls -l RavAva-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RavAva-iOS-unsigned-ipa
          path: RavAva-iOS-unsigned.ipa
          retention-days: 30
