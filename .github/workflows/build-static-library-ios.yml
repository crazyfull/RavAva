# Builds libRavAva for iOS as RavAva.xcframework: device (arm64) + iPhone Simulator (arm64, Apple-silicon Macs).
# Each slice is ONE static library with everything inside: RavAva + Opus + webrtc-audio-processing (echo cancellation, noise
# suppression, AGC), and the slice carries every header an app needs. Xcode picks the right slice by itself.
# Used by hand (Run workflow -> artifact "RavAva-iOS-static") and by build-demo-ios.yml (workflow_call), so there is
# exactly one place that builds the iOS library.
# The audio is NOT run here (a CI machine has no iPhone): this proves "it builds and links".
# If the webrtc build of a slice fails that slice is still built, without echo cancellation (a warning says so).
name: Build static library iOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  slice:
    name: slice ${{ matrix.sdk }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    env:
      OPUS_VERSION: "1.5.2"
      IOS_MIN: "13.0"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Opus
        run: |
          for url in "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz" \
                     "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-${OPUS_VERSION}.tar.gz"; do
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o opus.tar.gz "$url" && break
          done
          tar xf opus.tar.gz

      # ---------------------------------------------------------------- webrtc-audio-processing (echo / noise / AGC), optional
      - name: Cache webrtc-audio-processing
        id: webrtc_cache
        uses: actions/cache@v4
        with:
          path: webrtc-install
          key: webrtc-1.3-${{ matrix.sdk }}-arm64-${{ env.IOS_MIN }}-${{ hashFiles('libs/webrtc/build_ios.sh', 'libs/collect_licenses.sh') }}

      - name: Build webrtc-audio-processing (${{ matrix.sdk }} arm64)
        if: steps.webrtc_cache.outputs.cache-hit != 'true'
        continue-on-error: true            # no echo cancellation is better than no library
        run: |
          brew install meson ninja
          mkdir -p webrtc-src
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 \
                -o webrtc.tar.xz "https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/webrtc-audio-processing-1.3.tar.xz"; then
            echo "Primary server failed. Trying GitLab..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 \
                -o webrtc.tar.xz "https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v1.3/webrtc-audio-processing-v1.3.tar.gz"
          fi
          tar xf webrtc.tar.xz -C webrtc-src --strip-components=1
          IOS_MIN=$IOS_MIN libs/webrtc/build_ios.sh webrtc-src ${{ matrix.sdk }} webrtc-install

      - name: Is webrtc available?
        id: webrtc
        run: |
          if [ -f webrtc-install/lib/libwebrtc-audio-processing-1.a ]; then
            echo "root=$GITHUB_WORKSPACE/webrtc-install" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::webrtc-audio-processing was not built for ${{ matrix.sdk }}: this slice has no echo cancellation"
          fi

      # ---------------------------------------------------------------- Opus + RavAva, merged into one archive
      - name: Build Opus + libRavAva (${{ matrix.sdk }} arm64)
        run: |
          set -euxo pipefail
          sdk=${{ matrix.sdk }}
          FLAGS=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$sdk -DCMAKE_OSX_ARCHITECTURES=arm64
                 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN -DCMAKE_BUILD_TYPE=Release
                 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY)
          cmake -S "opus-${OPUS_VERSION}" -B opus-build "${FLAGS[@]}" \
                -DCMAKE_INSTALL_PREFIX="$PWD/opus-$sdk" -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_INSTALL_PKG_CONFIG_MODULE=OFF \
                -DOPUS_INSTALL_CMAKE_CONFIG_MODULE=OFF
          cmake --build opus-build -j 4
          cmake --install opus-build

          WEBRTC_ROOT="${{ steps.webrtc.outputs.root }}"
          if [ -n "$WEBRTC_ROOT" ]; then
            WARGS=(-DRAVAVA_WITH_WEBRTC=ON "-DRAVAVA_WEBRTC_ROOT=$WEBRTC_ROOT"
                   -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH)
          else
            WARGS=(-DRAVAVA_WITH_WEBRTC=OFF)
          fi
          cmake -S src/ravava -B ravava-build "${FLAGS[@]}" \
                -DCMAKE_INSTALL_PREFIX="$PWD/ravava-$sdk" "${WARGS[@]}" \
                -DRAVAVA_OPUS_ROOT="$PWD/opus-$sdk" \
                -DRAVAVA_OPUS_INCLUDE_DIR="$PWD/opus-$sdk/include/opus" -DRAVAVA_OPUS_LIB="$PWD/opus-$sdk/lib/libopus.a"
          cmake --build ravava-build -j 4
          cmake --install ravava-build

          # the package: lib/libRavAva.a (RavAva + Opus + webrtc) and include/ (ravava/*.h and opus.h & co)
          mkdir -p RavAva-iOS/lib
          EXTRA=()
          [ -n "$WEBRTC_ROOT" ] && EXTRA=("$WEBRTC_ROOT/lib/libwebrtc-audio-processing-1.a")
          libtool -static -o RavAva-iOS/lib/libRavAva.a "ravava-$sdk/lib/libRavAva.a" "opus-$sdk/lib/libopus.a" ${EXTRA[@]+"${EXTRA[@]}"}
          cp -R "ravava-$sdk/include" RavAva-iOS/include
          # license texts travel with the binary (Opus / webrtc: BSD-3-Clause, abseil: Apache-2.0)
          mkdir -p RavAva-iOS/licenses/opus RavAva-iOS/licenses/ravava
          cp "opus-${OPUS_VERSION}/COPYING" RavAva-iOS/licenses/opus/COPYING
          if [ -n "$WEBRTC_ROOT" ]; then      # webrtc is inside the binary: its license texts MUST be in the package
            [ -d "$WEBRTC_ROOT/licenses/webrtc-audio-processing" ] || { echo "::error::webrtc was linked but $WEBRTC_ROOT/licenses is missing (stale cache?)"; exit 1; }
            cp -R "$WEBRTC_ROOT/licenses/." RavAva-iOS/licenses/
            ls RavAva-iOS/licenses/webrtc-audio-processing | grep -qi 'abseil' || { echo "::error::no abseil license in the package"; exit 1; }
          fi
          cp THIRD_PARTY_NOTICES.md RavAva-iOS/licenses/THIRD_PARTY_NOTICES.md
          cp LICENSE RavAva-iOS/licenses/ravava/LICENSE
          for f in opus/COPYING THIRD_PARTY_NOTICES.md ravava/LICENSE; do [ -s RavAva-iOS/licenses/$f ] || { echo "::error::missing license file $f"; exit 1; }; done
          find RavAva-iOS/licenses -type f | sort
          cp example/IOS.md RavAva-iOS/README.md
          lipo -info RavAva-iOS/lib/libRavAva.a
          vtool -show-build RavAva-iOS/lib/libRavAva.a | head -12 || true
          ls -l RavAva-iOS/lib; find RavAva-iOS/include -name '*.h' | sort | head -60

      - name: Link smoke test (${{ matrix.sdk }})
        run: |
          set -euxo pipefail
          if [ "${{ matrix.sdk }}" = iphoneos ]; then VMIN="-miphoneos-version-min=$IOS_MIN"; else VMIN="-mios-simulator-version-min=$IOS_MIN"; fi
          xcrun --sdk ${{ matrix.sdk }} clang++ -std=c++17 -arch arm64 $VMIN \
              ci/ios_smoke.cpp -I RavAva-iOS/include -I RavAva-iOS/include/ravava \
              RavAva-iOS/lib/libRavAva.a \
              -framework Foundation -framework CoreFoundation -framework AudioToolbox -framework AVFoundation -framework CoreAudio \
              -o ios_smoke
          file ios_smoke

      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.sdk }}
          path: RavAva-iOS
          retention-days: 3

  xcframework:
    needs: slice
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slice-iphoneos
          path: slice-iphoneos
      - uses: actions/download-artifact@v4
        with:
          name: slice-iphonesimulator
          path: slice-iphonesimulator
      - name: Pack RavAva.xcframework
        run: |
          set -euxo pipefail
          mkdir -p RavAva-iOS-static
          xcodebuild -create-xcframework \
              -library slice-iphoneos/lib/libRavAva.a        -headers slice-iphoneos/include \
              -library slice-iphonesimulator/lib/libRavAva.a -headers slice-iphonesimulator/include \
              -output RavAva-iOS-static/RavAva.xcframework
          cp example/IOS.md RavAva-iOS-static/README.md
          # both slices (they differ if webrtc failed on one of them): merge, so nothing is lost
          mkdir -p RavAva-iOS-static/licenses
          cp -R slice-iphoneos/licenses/. RavAva-iOS-static/licenses/
          cp -R slice-iphonesimulator/licenses/. RavAva-iOS-static/licenses/
          find RavAva-iOS-static -maxdepth 3 | sort
          cat RavAva-iOS-static/RavAva.xcframework/Info.plist | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: RavAva-iOS-static
          path: RavAva-iOS-static
          retention-days: 30
